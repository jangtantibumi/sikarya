<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111113">
    <meta name="robots" content="noindex, nofollow">
    <title>Jaringan Terputus — SubaArch ERP</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 50% 12%, rgba(242, 201, 76, .14), transparent 34%),
                #080809;
        }
        main {
            width: min(430px, 100%);
            padding: 34px;
            text-align: center;
            border: 1px solid rgba(242, 201, 76, .24);
            border-radius: 22px;
            background: #151517;
            box-shadow: 0 28px 80px rgba(0, 0, 0, .55);
        }
        .mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 22px;
            display: grid;
            place-items: center;
            border-radius: 19px;
            color: #151515;
            background: linear-gradient(145deg, #f2c94c, #ffe17d);
            font-weight: 800;
        }
        h1 { margin: 0 0 10px; font-size: 23px; }
        p { margin: 0; color: #a5a5ad; font-size: 14px; line-height: 1.65; }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 12px;
            color: #111;
            background: #f2c94c;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        small { display: block; margin-top: 16px; color: #686871; line-height: 1.5; }
    </style>
</head>
<body>
    <main>
        <div class="mark">SA</div>
        <h1>Koneksi internet terputus</h1>
        <p>SubaArch ERP tidak menyimpan data dashboard atau data pribadi untuk penggunaan offline. Sambungkan kembali perangkat Anda agar informasi yang tampil selalu aman dan terbaru.</p>
        <button type="button" onclick="window.location.reload()">Coba Hubungkan Kembali</button>
        <small>Hanya aset tampilan dasar yang tersimpan di perangkat ini.</small>
    </main>
</body>
</html>
